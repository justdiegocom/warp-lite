[package]
name = "warp-remote-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false
description = "The phone's core: warp-remote's client behind a small synchronous C interface"
license = "MIT"

[lib]
name = "warp_remote_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
warp-remote = { path = "../../warp-remote" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
serde_json = "1"
# netdev 0.46 (through iroh's netwatch) uses libc's in6_ifreq on every Apple OS, but libc 0.2.190 and later
# define it for macOS only, so the iOS build breaks: hold libc until netdev is fixed.
libc = "=0.2.189"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"
