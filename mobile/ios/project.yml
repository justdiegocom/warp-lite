# XcodeGen spec (xcodegen generate → WarpRemote.xcodeproj). build.sh builds the Rust core first.
name: WarpRemote
options:
  bundleIdPrefix: com.justdiego
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  WarpRemote:
    type: application
    platform: iOS
    sources:
      - WarpRemote
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: Warp
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Scan the pairing code that Warp shows on your computer.
        NSLocalNetworkUsageDescription: Connect straight to Warp on your computer when both are on the same network.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: WarpRemote
        PRODUCT_BUNDLE_IDENTIFIER: com.justdiego.warpapp
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_OBJC_BRIDGING_HEADER: WarpRemote/WarpRemote-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/../core/include
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/build/rust/$(PLATFORM_NAME)
        OTHER_LDFLAGS: -lwarp_remote_core -lresolv -framework Security -framework SystemConfiguration
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        DEAD_CODE_STRIPPING: YES
  # The app driven end to end against a real Warp (build.sh demo): real taps, screenshots.
  WarpRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - WarpRemoteUITests
    dependencies:
      - target: WarpRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justdiego.warpapp.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
schemes:
  WarpRemote:
    build:
      targets:
        WarpRemote: all
        WarpRemoteUITests: [test]
    test:
      targets:
        - WarpRemoteUITests
