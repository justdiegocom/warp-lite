[package]
name = "warp-remote"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false
description = "Warp's remote sidecar: lets a paired phone reach this Warp over iroh"
license = "MIT"

[lib]
name = "warp_remote"
path = "src/lib.rs"

[[bin]]
name = "warp-remote"
path = "src/main.rs"

[[bin]]
name = "warp-remote-cli"
path = "src/bin/cli.rs"

[dependencies]
# No metrics; ring for TLS (builds everywhere with a plain C compiler); UPnP/NAT-PMP/PCP port mapping
# makes direct connections likelier behind home routers.
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring", "portmapper"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
data-encoding = "2"
getrandom = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
